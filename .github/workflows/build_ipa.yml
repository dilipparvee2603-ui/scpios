name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 7.0.0)'
        required: false
        default: '7.0.0'
      build_number:
        description: 'Build Number (e.g. 2100)'
        required: false
        default: '2100'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build ScenePack iOS IPA
    runs-on: macos-14
    defaults:
      run:
        working-directory: scenepack_mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA (Payload Archive)
        run: |
          mkdir -p build/ios/ipa/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          elif [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          else
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
            echo "Found Runner.app at: $APP_PATH"
            cp -r "$APP_PATH" build/ios/ipa/Payload/
          fi
          cd build/ios/ipa
          zip -r -q ScenePack-iOS.ipa Payload
          rm -rf Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScenePack-iOS-IPA
          path: scenepack_mobile/build/ios/ipa/ScenePack-iOS.ipa
          retention-days: 14

      - name: Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v7.0.0-release
          name: "ScenePack iOS v7.0.0 Production Release"
          body: |
            ### 🎬 ScenePack Pro for iOS (Release IPA)
            
            This is the production `.ipa` package for iPhone and iPad.
            
            #### Features Included:
            - **Storage & Cache Management**: Clear all temporary 4K videos, thumbnails, and preview caches on demand + auto-clear after exports.
            - **Optimized 4K Scene Detection**: Ultra-fast 360p bilinear scaling and keyframe thumbnails (~15s detection).
            - **Photos & Camera Roll Access**: Native video import and direct export to Photos albums.
            - **Files & Documents Access**: Import MKV/MP4/MOV from Files & iCloud Drive, and save directly to Files or share via Share Sheet.
            - **Apple Silicon Hardware Acceleration**: Powered by native `h264_videotoolbox` encoder.
            
            #### How to Install on iOS:
            1. Download `ScenePack-iOS.ipa` below.
            2. Sideload onto your iPhone using **Sideloadly**, **AltStore**, **Scarlet**, or **TrollStore**.
          files: scenepack_mobile/build/ios/ipa/ScenePack-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
