name: scenepack_mobile
description: "A professional scene detection workstation for mobile."
publish_to: 'none'
version: 7.00.0+2100

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  video_player: ^2.8.2
  path_provider: ^2.1.2
  path: ^1.8.3
  ffmpeg_kit_flutter_new: ^4.1.0
  share_plus: ^9.0.0
  gal: ^2.3.1
  firebase_core: ^2.24.2
  firebase_auth: ^4.20.0
  google_sign_in: ^6.1.6
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  url_launcher: ^6.2.5
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  cloud_firestore: ^4.17.5
  firebase_database: ^10.5.7
  http: ^1.6.0
  dio: ^5.4.1
  open_filex: ^4.4.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
